name: ${COMPOSE_PROJECT_NAME:-mini-crm}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: "3001"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
  POSTGRES_USER: ${POSTGRES_USER:-mini_crm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:-}
  TZ: ${TZ:-UTC}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_crm}
      POSTGRES_USER: ${POSTGRES_USER:-mini_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrate:
    image: mini-crm-api:local
    build: *api-build
    pull_policy: build
    working_dir: /app/packages/db
    environment: *api-environment
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: mini-crm-api:local
    build: *api-build
    pull_policy: build
    restart: unless-stopped
    environment: *api-environment
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3001/health'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/"
        NEXT_PUBLIC_SOCKET_URL: "/"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      INFORMATION: ${INFORMATION:-}
      TZ: ${TZ:-UTC}

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
